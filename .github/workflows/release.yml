name: release
# Every push to main that passes the gates publishes the pool -- every
# package this repository builds, both architectures -- to the one package
# named after this repository, by this workflow's own token:
# ghcr.io/ybolab/mica-core:pool.<arch>.build-<commit12>. The assembly pins it
# through deps/packages/. The release is public, so `make deps` needs no token;
# publish.sh reads what it pushed back anonymously and fails while the package
# is not public. The arm64 archives are cross-compiled by the pinned
# IMAGE_MICA_BUILD_RUST and packed in the arm64 image of IMAGE_MICA_BUILD_BASE
# under emulation; both are public indexes of the mica-build-env release.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: The mica-build-env release at its pin
        run: make deps
      - name: Emulation for the arm64 packaging image
        uses: docker/setup-qemu-action@v3
      - name: Prepare the check container network
        run: docker network inspect traefik >/dev/null 2>&1 || docker network create --label ai-agent=true traefik
      - name: Lint, the UI build contract and the Rust gate
        run: make check
      - name: The shipped D-Bus policy against a real dbus-daemon
        run: |
          set -euo pipefail
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends dbus python3
          # Root, because the test drops to an unprivileged uid to prove the
          # policy refuses it; the runner user is not root.
          $SUDO make dbus-policy-test
      - name: Pack and gate
        run: |
          set -euo pipefail
          make pool
          make package-gate
      - name: Publish the pool of this commit
        if: github.event_name == 'push'
        run: make publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
