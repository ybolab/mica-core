# cargo-deny 0.19.x configuration for the native deployment workspace.
#
# Deliberately SMALLER than pkgs/mosd/deny.toml, and the difference is the point.
# That file carries two exceptions, and neither one reaches this crate:
#
#   - the CC0-1.0 allowance exists for tiny-keccak, reached through
#     `rumqttd -> config -> rust-ini -> ordered-multimap -> dlv-list ->
#     const-random -> const-random-macro`. rumqttd is the on-device MQTT
#     broker's dependency; nothing here depends on it.
#   - the RUSTSEC-2025-0134 ignore is for rustls-pemfile, "pulled in by
#     axum-server tls-rustls". axum-server is apid's; nothing here serves HTTP.
#
# The same reasoning drops mosd's BSD-2-Clause and BSD-3-Clause allowances. Over
# there they are matched -- zerocopy is BSD-2, and encoding_rs, matchit and
# subtle are BSD-3, all reached through apid and zbus. Nothing in this graph
# carries either licence, which `cargo deny` says out loud as
# `license-not-encountered`.
#
# Copying any of the four across would have been the easy move and the wrong
# one: an allowance that names no real chain reads as an approved risk rather
# than as dead configuration, and it would silently pre-approve those licences
# if this graph ever grew toward them. Re-adding one is a line and a review;
# noticing an unreviewed one is neither.

[licenses]
# The one workspace crate is publish = false; skip license checks for it.
# Every entry below is matched by this graph today.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[advisories]
# Vulnerabilities are errors by default in the version-2 schema;
# unmaintained advisories only warn.
unmaintained = "all"
