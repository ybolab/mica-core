[package]
name = "mica-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The executable keeps its name; the package is named for the workspace.
[[bin]]
name = "micad"
path = "src/main.rs"

[dependencies]
micad-settings = { path = "../micad-settings" }
# The one `com.mica.*` bus-name rule: the service registry takes
# it rather than restating it.
mica-busname = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
# The settings store and the offline provisioning document are both TOML; the
# crate is already in the workspace graph via micad-settings. The update policy
# document is no longer among them -- PLAN-070 F6b moved it to
# /mica/config/updates.json, which is JSON.
toml = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
argon2 = { workspace = true }
bcrypt = { workspace = true }
ring = { workspace = true }
hex = { workspace = true }
# The WireGuard keystore: base64 is the key format on disk and on the wire,
# x25519-dalek derives the public half of a private key without a `wg` binary.
base64 = { workspace = true }
x25519-dalek = { workspace = true }
# `process` for the `networkctl delete` teardown the network reconciler runs when a
# virtual device's unit goes away; networkd does not reap devices it created.
tokio = { workspace = true, features = ["process", "signal", "time", "io-util"] }
rustix = { workspace = true, features = ["process"] }
zbus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }
