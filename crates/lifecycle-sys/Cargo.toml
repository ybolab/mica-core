[package]
name = "lifecycle-sys"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std", "stdio", "system", "process", "mount"] }

[dev-dependencies]
tempfile = { workspace = true }

# The sole isolated UAPI boundary; see the dated lifecycle ioctl decision.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
