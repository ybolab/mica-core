[package]
name = "mica-deploy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
lifecycle-sys = { path = "../lifecycle-sys" }
linux-keyutils = { version = "0.2.5", features = ["std"] }
ring = { workspace = true }
# Its own feature set, not the workspace rustix: no default features, so the
# static mica-runkit built from this crate alone links only what it names.
rustix = { version = "1", default-features = false, features = ["fs", "std", "stdio", "system", "process", "mount"] }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
