<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny send_destination="com.mos.mqttsample.reference"/>
    <deny receive_sender="com.mos.mqttsample.reference"/>
  </policy>

  <policy user="mos">
    <allow own="com.mos.mqttsample.reference"/>
  </policy>

  <policy user="mos-mqttd">
    <allow send_destination="com.mos.mqttsample.reference"
           send_interface="com.mos.Item1"
           send_member="GetItems"/>
    <allow receive_sender="com.mos.mqttsample.reference"
           receive_interface="com.mos.Item1"
           receive_member="ItemsChanged"/>
    <allow send_destination="com.mos.mqttsample.reference"
           send_interface="com.mos.Item1"
           send_member="SetValue"/>
  </policy>

  <policy user="root">
    <allow send_destination="com.mos.mqttsample.reference"
           send_interface="com.mos.Item1"
           send_member="GetItems"/>
  </policy>
</busconfig>
