<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- com.mica.micad is a ROOT-ONLY bus name.

       The interface behind this name reboots and powers off the appliance,
       rewrites the persisted settings tree, and answers
       SetTransientRootPassword by writing a root credential straight into
       /etc/shadow.

       Every management client that speaks to micad runs as root: micad.service
       owns the name as root, and apid.service plus the boot health gate also
       run as root. mica-mqttd receives no exception and has zero access to this
       interface; its device identity is root-rendered runtime configuration.

       receive_sender is restricted TOO, and that is not merely symmetry. The
       interface broadcasts SettingsChanged(path, value_json) carrying the
       settings VALUE. A uid that may not send could still subscribe and read
       every settings change as it happens — including
       access.webAdmin.password_hash the moment an operator sets it. A caller
       who cannot ask can still listen, so both directions are closed.

       Why the default context carries explicit <deny> rather than merely
       omitting an <allow>: the standard system.conf default stanza already
       denies method_call, but it ALLOWS receive_type="signal" for everyone.
       Omitting the allow alone would leave SettingsChanged readable by any
       uid on the device. The deny is what actually closes the receive
       side, and it also makes the send side hold independently of whatever the
       base configuration happens to permit.

       FUTURE NAMED CLIENT — read this before editing.
       If apid (or anything else) ever gains its own non-root user, give it its
       OWN block:

           <policy user="apid">
             <allow send_destination="com.mica.micad"/>
             <allow receive_sender="com.mica.micad"/>
           </policy>

       ADD a block. Do NOT reopen the default context. Moving these rules back
       into <policy context="default"> is the easy wrong move: in a diff it
       reads like restoring a line, while it actually re-grants every local uid
       on the device — including whatever unprivileged helper prompted the
       change in the first place. The named-user block grants exactly one
       identity and fails closed for the rest.

       DEFERRED — broader per-method allowlisting, deliberately not implemented here.
       D-Bus policy can split members with send_interface=/send_member=, so the
       read-only members (GetSettings, GetState, GetUpdateState) could be
       separated from the mutating ones (SetSettings, Reboot, PowerOff,
       SetTransientRootPassword, ReportHealth, ForgetService, InstallUpdate
       and MarkUpdate, the last two of which hand out the device's next boot
       if granted by accident). RECOMMENDATION: do the split, but only once a
       second identity actually exists. Today every caller of this interface is
       root, so a per-method split would partition one identity against itself
       — it would add a list that has to be kept in step with
       micad/micad/src/bus.rs, and a member added there without a matching rule
       here fails at runtime with an AccessDenied that looks nothing like "you
       forgot the policy". mica-mqttd is deliberately absent from every allow
       block, and the live policy test asserts that zero-access boundary.)
       The split of THIS interface earns its cost the day a non-root apid
       needs GetSettings and GetState and must NOT reach Reboot or
       SetTransientRootPassword; that is the point at which the
       named-client block above should be written with send_member= rules
       instead of a blanket send_destination=. -->

  <policy context="default">
    <deny send_destination="com.mica.micad"/>
    <deny receive_sender="com.mica.micad"/>
  </policy>

  <policy user="root">
    <allow own="com.mica.micad"/>
    <allow send_destination="com.mica.micad"/>
    <allow receive_sender="com.mica.micad"/>
  </policy>
</busconfig>
